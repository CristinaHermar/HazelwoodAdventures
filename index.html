<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hazelwood Adventures</title>
<meta name="description" content="Pick what to do in Glasgow this weekend, with biking distance from Hazelwood House.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg fill='none' stroke='%233A342C' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M20 30c-4-8 2-16 12-16s18 6 16 16-10 18-20 18-12-10-8-18Z'/%3E%3Cpath d='M14 34 4 40'/%3E%3Cpath d='M28 46 24 60'/%3E%3Cpath d='M40 20 52 6'/%3E%3Cpath d='M36 16 46 4'/%3E%3Cpath d='M44 24 58 12'/%3E%3Cpath d='M48 10 52 14'/%3E%3Cpath d='M43 8 47 12'/%3E%3Cpath d='M52 16 56 20'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <svg class="hero__arch" viewBox="0 0 200 200" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="100" cy="100" r="86"/>
    <circle cx="100" cy="100" r="3.5" fill="currentColor" stroke="none"/>
    <path d="M100 100 66 140 100 60 134 100Z" stroke-linejoin="round"/>
    <path d="M100 22v18M100 160v18M22 100h18M160 100h18" stroke-linecap="round"/>
  </svg>
  <div class="hero__inner">
    <p class="eyebrow">Hazelwood House · 52 First Gardens, G41 5NB</p>
    <h1>Hazelwood<br>Adventures</h1>
    <hr class="hero__rule">
    <p class="hero__sub">Pick whatever plan you fancy doing with <strong>Cristina</strong> — tap Sat or Sun to build your day, then message her straight from here on WhatsApp.</p>
  </div>
</header>

<main>
  <div class="controls">
    <input id="search" type="search" placeholder="Search a place…" autocomplete="off">

    <p class="filter-label">Area</p>
    <div class="filter-row" id="zoneFilters" aria-label="Filter by area"></div>
    <p class="filter-label">Category</p>
    <div class="filter-row" id="typeFilters" aria-label="Filter by category"></div>

    <div class="sort-row">
      <span>Sort by</span>
      <select id="sortBy">
        <option value="bike">Biking distance</option>
        <option value="place">Name (A–Z)</option>
        <option value="location">Area</option>
      </select>
    </div>
  </div>

  <p class="count" id="resultCount"></p>

  <ul class="cards" id="cardList"></ul>
</main>

<div class="plan-bar" id="planBar">
  <button class="plan-bar__tab" data-day="sat" id="tabSat">
    <span class="plan-bar__label">Saturday</span>
    <span class="plan-bar__count" id="countSat">0</span>
  </button>
  <button class="plan-bar__tab" data-day="sun" id="tabSun">
    <span class="plan-bar__label">Sunday</span>
    <span class="plan-bar__count" id="countSun">0</span>
  </button>
</div>

<div class="drawer" id="drawer">
  <div class="drawer__handle" id="drawerHandle"></div>
  <div class="drawer__content">
    <div class="drawer__header">
      <h2 id="drawerTitle">Saturday</h2>
      <span class="drawer__total" id="drawerTotal"></span>
    </div>
    <ol class="drawer__list" id="drawerList"></ol>
    <p class="drawer__empty" id="drawerEmpty">Nothing picked yet. Tap "Sat" or "Sun" on a card.</p>
    <button class="wa-send" id="drawerWhatsApp" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M20.5 3.5A11 11 0 0 0 3.6 17.3L2 22l4.9-1.6A11 11 0 1 0 20.5 3.5Zm-8.5 17.8a9 9 0 0 1-4.6-1.3l-.3-.2-3 1 1-2.9-.2-.3A9 9 0 1 1 12 21.3Zm5-6.7c-.3-.1-1.6-.8-1.8-.9-.2-.1-.4-.1-.6.1-.2.3-.7.9-.8 1-.2.2-.3.2-.5.1-.3-.1-1.2-.4-2.2-1.4-.8-.7-1.4-1.6-1.5-1.9-.2-.3 0-.4.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.1-.6-1.5-.8-2-.2-.5-.4-.5-.6-.5h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2 0 1.3.9 2.6 1.1 2.8.1.2 1.9 2.9 4.6 4 .6.3 1.1.4 1.5.5.6.2 1.2.2 1.6.1.5-.1 1.6-.6 1.8-1.3.2-.6.2-1.1.2-1.3-.1-.1-.3-.2-.6-.3Z"/></svg>
      <span id="drawerWhatsAppLabel">Send this day on WhatsApp</span>
    </button>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
